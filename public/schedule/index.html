<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>スケジュール | 福岡中央ライオンズクラブ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-container": "#ffdad6",
              "on-surface": "#1b1c1c",
              "surface-container": "#f0eded",
              "on-primary": "#ffffff",
              "primary-fixed": "#ffdad5",
              "background": "#fbf9f8",
              "on-error": "#ffffff",
              "outline-variant": "#e7bdb7",
              "outline": "#926f6a",
              "on-tertiary-container": "#ffeee0",
              "surface-tint": "#c00010",
              "tertiary": "#7d4900",
              "secondary-fixed-dim": "#a6c8ff",
              "secondary": "#1d5fa8",
              "tertiary-fixed": "#ffdcbd",
              "on-tertiary": "#ffffff",
              "surface-container-highest": "#e4e2e1",
              "on-primary-fixed-variant": "#930009",
              "surface-bright": "#fbf9f8",
              "on-primary-container": "#ffedeb",
              "surface-variant": "#e4e2e1",
              "on-background": "#1b1c1c",
              "surface-dim": "#dcd9d9",
              "on-surface-variant": "#5d3f3c",
              "surface-container-high": "#eae8e7",
              "on-secondary-fixed": "#001c3b",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#410002",
              "primary-fixed-dim": "#ffb4ab",
              "inverse-surface": "#303030",
              "secondary-container": "#7ab0ff",
              "primary-container": "#d9161b",
              "error": "#ba1a1a",
              "on-tertiary-fixed-variant": "#693c00",
              "on-error-container": "#93000a",
              "surface": "#fbf9f8",
              "inverse-on-surface": "#f3f0f0",
              "on-tertiary-fixed": "#2c1600",
              "tertiary-container": "#9f5e00",
              "tertiary-fixed-dim": "#ffb86e",
              "secondary-fixed": "#d5e3ff",
              "inverse-primary": "#ffb4ab",
              "primary": "#af000d",
              "surface-container-low": "#f6f3f2",
              "on-secondary": "#ffffff",
              "on-secondary-fixed-variant": "#004787",
              "on-secondary-container": "#00417e"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Inter", "Noto Sans JP"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#af000d"/>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fbf9f8]/85 backdrop-blur-md shadow-[0_8px_32px_rgba(27,28,28,0.06)] h-16 flex items-center justify-between px-6">
<a href="/" class="flex items-center gap-2">
<img src="/images/logo2.png" alt="Lions Club" class="h-9 w-9 object-contain flex-shrink-0"/>
<span class="font-['Noto_Sans_JP'] font-bold text-sm tracking-tight text-[#1b1c1c]">福岡中央ライオンズクラブ</span>
</a>
<a href="/members/" class="w-9 h-9 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" style="font-size:20px;">lock</span>
</a>
</header>

<main class="pt-20 pb-32 px-4 max-w-2xl mx-auto w-full">

  <!-- Page Header -->
  <section class="mb-8 mt-4">
    <span class="text-primary font-bold tracking-widest text-xs uppercase mb-2 block">Schedule</span>
    <h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">スケジュール</h2>
    <p class="text-on-surface-variant text-sm leading-relaxed">活動予定と実績をカレンダーでご確認いただけます。</p>
  </section>

  <!-- Calendar Card -->
  <div class="bg-surface-container-lowest rounded-[1.5rem] shadow-[0_8px_32px_rgba(27,28,28,0.04)] overflow-hidden mb-4">

    <!-- Month Navigation -->
    <div class="flex items-center justify-between px-6 py-4">
      <button id="prev-month" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95">
        <span class="material-symbols-outlined text-on-surface-variant" style="font-size:20px;">chevron_left</span>
      </button>
      <div class="flex items-center gap-2">
        <span id="month-label" class="font-['Noto_Sans_JP'] font-bold text-base text-on-surface tracking-wide"></span>
        <button id="today-btn" class="hidden px-3 py-1 rounded-full bg-primary/10 text-primary text-xs font-bold hover:bg-primary/20 active:scale-95 transition-all">今日</button>
      </div>
      <button id="next-month" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95">
        <span class="material-symbols-outlined text-on-surface-variant" style="font-size:20px;">chevron_right</span>
      </button>
    </div>

    <!-- Day Headers -->
    <div class="grid grid-cols-7 px-2">
      <div class="text-center text-[11px] font-bold text-on-surface-variant py-1">月</div>
      <div class="text-center text-[11px] font-bold text-on-surface-variant py-1">火</div>
      <div class="text-center text-[11px] font-bold text-on-surface-variant py-1">水</div>
      <div class="text-center text-[11px] font-bold text-on-surface-variant py-1">木</div>
      <div class="text-center text-[11px] font-bold text-on-surface-variant py-1">金</div>
      <div class="text-center text-[11px] font-bold text-[#1d5fa8] py-1">土</div>
      <div class="text-center text-[11px] font-bold text-[#af000d] py-1">日</div>
    </div>

    <!-- Days Grid -->
    <div id="calendar-grid" class="grid grid-cols-7 px-1 pb-3"></div>

  </div>


</main>

<!-- Footer -->
<footer class="w-full mt-auto bg-[#f6f3f2] flex items-center justify-center px-8 py-8 mb-24">
<div class="text-[10px] text-[#1b1c1c]/50 font-label">© 2026 福岡中央ライオンズクラブ</div>
</footer>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-6 pt-3 bg-[#fbf9f8]/85 backdrop-blur-lg rounded-t-[1.5rem] shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
  <a class="flex flex-col items-center justify-center text-[#1b1c1c] opacity-60 px-3 py-1 rounded-2xl transition-all" href="/">
    <span class="material-symbols-outlined">home</span>
    <span class="font-['Noto_Sans_JP'] text-[10px] font-medium tracking-wide mt-1">HOME</span>
  </a>
  <a class="flex flex-col items-center justify-center text-[#1d5fa8] bg-[#7ab0ff]/10 px-3 py-1 rounded-2xl transition-all" href="/schedule/">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
    <span class="font-['Noto_Sans_JP'] text-[10px] font-medium tracking-wide mt-1">予定</span>
  </a>
  <a class="flex flex-col items-center justify-center text-[#1b1c1c] opacity-60 px-3 py-1 rounded-2xl transition-all" href="/activities/">
    <span class="material-symbols-outlined">volunteer_activism</span>
    <span class="font-['Noto_Sans_JP'] text-[10px] font-medium tracking-wide mt-1">活動</span>
  </a>
  <a class="flex flex-col items-center justify-center text-[#1b1c1c] opacity-60 px-3 py-1 rounded-2xl transition-all" href="/about/">
    <span class="material-symbols-outlined">info</span>
    <span class="font-['Noto_Sans_JP'] text-[10px] font-medium tracking-wide mt-1">紹介</span>
  </a>
  <a class="flex flex-col items-center justify-center text-[#1b1c1c] opacity-60 px-3 py-1 rounded-2xl transition-all" href="/contact/">
    <span class="material-symbols-outlined">mail</span>
    <span class="font-['Noto_Sans_JP'] text-[10px] font-medium tracking-wide mt-1">連絡</span>
  </a>
</nav>

<script>
(function () {
  // Category color mapping
  var categoryColors = {
    '例会':    { tag: 'bg-secondary',        badge: 'bg-secondary/10 text-secondary' },
    'イベント': { tag: 'bg-tertiary',          badge: 'bg-tertiary/10 text-tertiary' },
    '式典': { tag: 'bg-primary',           badge: 'bg-primary/10 text-primary' }
  };
  var defaultColor = { tag: 'bg-on-surface/60', badge: 'bg-on-surface/10 text-on-surface' };

  var events = [
    { date: '2026-04-07', title: 'さくらフェスタ', link: '/activity_detail/sakura_festa.html', category: 'イベント', image: '/images/activities/2026-04-07_sakura-festa/schedule.jpg', desc: '春の恒例イベント。桜の下で地域の皆さんと交流します。' },
    { date: '2026-04-01', title: '4月度第一例会', category: '例会', desc: '4月度第一例会を開催します。' },
    { date: '2026-03-18', title: '3月度第二例会', category: '例会', desc: '3月度第二例会を開催します。' },
    { date: '2026-03-04', title: '3月度第一例会', category: '例会', desc: '3月度第一例会を開催します。' },
    { date: '2026-02-18', title: '2月度第二例会', category: '例会', desc: '2月度第二例会を開催します。' },
    { date: '2026-02-04', title: '2月度第一例会', category: '例会', desc: '2月度第一例会を開催します。' },
    { date: '2026-01-21', title: '1月度第二例会', category: '例会', desc: '1月度第二例会を開催します。' },
    { date: '2025-12-16', title: 'クリスマス例会', link: '/activity_detail/christmas.html', category: '例会', image: '/images/activities/2025-12-16_christmas/christmas01.jpg', desc: '年末恒例のクリスマス例会。会員同士の親睦を深め、一年の活動を振り返りました。' },
    { date: '2025-11-04', title: '新会員入会式', link: '/activity_detail/new_member.html', category: '例会', image: '/images/activities/2025-11-04_new-member/new-member01.jpg', desc: '新たな仲間を迎える入会式を執り行いました。' },
    { date: '2025-08-20', title: '納涼例会', link: '/activity_detail/noryo.html', category: '例会', image: '/images/activities/2025-08-20_noryo/noryo01.jpg', desc: '夏の暑さを忘れるひととき。会員同士の親睦を深めました。' },
    { date: '2023-03-29', title: '結成60周年式典', link: '/activity_detail/60th_anniversary.html', category: '式典', image: '/images/activities/2023-03-29_60th-anniversary/anniversary01.jpg', desc: '福岡中央ライオンズクラブ結成60周年を祝う式典を開催しました。' }
  ];

  var eventMap = {};
  events.forEach(function (ev) { eventMap[ev.date] = ev; });

  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function toDateStr(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function formatDateDisplay(ds) {
    var p = ds.split('-');
    return p[0] + '.' + pad(parseInt(p[1])) + '.' + pad(parseInt(p[2]));
  }
  function getColors(cat) { return categoryColors[cat] || defaultColor; }

  function closePopup() {
    var overlay = document.getElementById('popup-overlay');
    if (overlay) overlay.remove();
  }

  function showPopup(ev) {
    closePopup();
    var colors = getColors(ev.category);
    var overlay = document.createElement('div');
    overlay.id = 'popup-overlay';
    overlay.className = 'fixed inset-0 z-[100] flex items-center justify-center px-6';
    overlay.style.background = 'rgba(27,28,28,0.5)';
    overlay.style.backdropFilter = 'blur(4px)';

    var imageHtml = ev.image
      ? '<div class="w-full aspect-[16/10] rounded-xl overflow-hidden mb-4 bg-surface-container">'
        + '<img src="' + ev.image + '" alt="' + ev.title + '" class="w-full h-full object-cover"/></div>'
      : '';

    var linkHtml = ev.link
      ? '<a href="' + ev.link + '" class="block w-full py-3 mt-4 bg-gradient-to-r from-secondary to-secondary-container text-white font-bold text-sm text-center rounded-full shadow-sm active:scale-95 transition-transform">詳しく見る</a>'
      : '';

    var card = document.createElement('div');
    card.className = 'bg-surface-container-lowest rounded-[1.5rem] shadow-lg max-w-sm w-full overflow-hidden';
    card.innerHTML = '<div class="p-5">'
      + '<div class="flex items-start justify-between mb-3">'
      + '<span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wider ' + colors.badge + '">' + ev.category + '</span>'
      + '<button id="popup-close" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors -mr-1 -mt-1">'
      + '<span class="material-symbols-outlined text-on-surface-variant" style="font-size:20px;">close</span></button></div>'
      + imageHtml
      + '<div class="flex items-center gap-1.5 text-on-surface-variant/70 mb-1.5">'
      + '<span class="material-symbols-outlined" style="font-size:14px;">calendar_today</span>'
      + '<span class="text-xs font-medium">' + formatDateDisplay(ev.date) + '</span></div>'
      + '<h3 class="text-lg font-bold text-on-surface leading-snug mb-2">' + ev.title + '</h3>'
      + '<p class="text-sm text-on-surface-variant leading-relaxed">' + ev.desc + '</p>'
      + linkHtml
      + '</div>';

    overlay.appendChild(card);
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function(e) { if (e.target === overlay) closePopup(); });
    document.getElementById('popup-close').addEventListener('click', closePopup);
  }

  function renderCalendar() {
    document.getElementById('month-label').textContent = viewYear + '年' + (viewMonth + 1) + '月';
    var grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    var firstDay = new Date(viewYear, viewMonth, 1).getDay();
    var startOffset = (firstDay + 6) % 7;
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (var i = 0; i < startOffset; i++) {
      var empty = document.createElement('div');
      empty.className = 'min-h-[3.5rem] border-b border-surface-container';
      grid.appendChild(empty);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = toDateStr(viewYear, viewMonth, d);
      var ev = eventMap[dateStr] || null;
      var colIndex = (startOffset + d - 1) % 7;
      var isSat = colIndex === 5;
      var isSun = colIndex === 6;
      var isToday = (viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate());

      var cell = document.createElement('div');
      cell.className = 'min-h-[3.5rem] border-b border-surface-container px-0.5 py-1 flex flex-col';

      var dayNum = document.createElement('span');
      var textColor = isSun ? 'text-[#af000d]' : isSat ? 'text-[#1d5fa8]' : 'text-on-surface/70';
      if (isToday) {
        dayNum.className = 'w-6 h-6 flex items-center justify-center rounded-full bg-primary text-white text-[11px] font-bold self-center';
      } else {
        dayNum.className = 'text-[11px] font-medium text-center ' + textColor;
      }
      dayNum.textContent = d;
      cell.appendChild(dayNum);

      if (ev) {
        var colors = getColors(ev.category);
        var tag = document.createElement('div');
        tag.className = colors.tag + ' text-white text-[8px] font-bold rounded px-1 py-0.5 mt-0.5 leading-tight truncate cursor-pointer hover:opacity-80 transition-opacity';
        tag.textContent = ev.title;
        tag.title = ev.title;
        (function(e) {
          tag.addEventListener('click', function() { showPopup(e); });
        })(ev);
        cell.appendChild(tag);
      }

      grid.appendChild(cell);
    }
  }

  function updateTodayBtn() {
    var btn = document.getElementById('today-btn');
    if (viewYear === today.getFullYear() && viewMonth === today.getMonth()) {
      btn.classList.add('hidden');
    } else {
      btn.classList.remove('hidden');
    }
  }

  document.getElementById('prev-month').addEventListener('click', function () {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    closePopup();
    renderCalendar();
    updateTodayBtn();
  });

  document.getElementById('next-month').addEventListener('click', function () {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    closePopup();
    renderCalendar();
    updateTodayBtn();
  });

  document.getElementById('today-btn').addEventListener('click', function () {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    closePopup();
    renderCalendar();
    updateTodayBtn();
  });

  renderCalendar();
  updateTodayBtn();
})();
</script>

</body></html>
