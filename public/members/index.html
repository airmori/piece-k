<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>会員専用 | 福岡中央ライオンズクラブ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>body{font-family:'Noto Sans JP',sans-serif;}</style>
</head>
<body class="bg-[#fbf9f8] min-h-screen flex items-center justify-center px-6">
<div class="w-full max-w-sm">
<div class="text-center mb-8">
<div class="flex items-center justify-center gap-2 mb-4">
<img src="/images/logo2.png" alt="Lions Club" class="h-10 w-10 object-contain"/>
<span class="font-bold text-sm text-[#1b1c1c]">福岡中央ライオンズクラブ</span>
</div>
<h1 class="text-xl font-bold text-[#1b1c1c] mb-1">会員専用ページ</h1>
<p class="text-sm text-[#1b1c1c]/60">パスワードを入力してお進みください</p>
</div>
<div id="error-msg" class="hidden">
<p style="color:#af000d;font-size:14px;margin-bottom:16px;text-align:center;">パスワードが正しくありません。</p>
</div>
<form id="login-form" class="space-y-4">
<input type="password" id="password-input" placeholder="パスワード" required autofocus
  class="w-full px-5 py-3 rounded-xl bg-white border border-[#e7bdb7]/30 text-sm focus:outline-none focus:ring-2 focus:ring-[#1d5fa8]/30 focus:border-[#1d5fa8]"/>
<button type="submit"
  class="w-full py-3 bg-[#1d5fa8] text-white font-bold text-sm rounded-full shadow-md hover:opacity-90 active:scale-95 transition-all">
  ログイン
</button>
</form>
<div class="text-center mt-6">
<a href="/" class="text-xs text-[#1b1c1c]/50 hover:text-[#af000d] transition-colors">← トップページに戻る</a>
</div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var pw = document.getElementById('password-input').value;
  // POST to Worker for server-side validation
  fetch('/api/members/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  }).then(function(res) {
    if (res.ok) {
      window.location.href = '/members/dashboard.html';
    } else {
      document.getElementById('error-msg').classList.remove('hidden');
    }
  });
});
</script>
</body>
</html>
